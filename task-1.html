<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        
        font-family: Arial, sans-serif;
        
        }
        .container {
    display:flex;
            justify-content:space-between;
            width: 100%;
            align-items: center;
            height: 100vh;
        }
        .right {
            width: 100%;
            height: 100%;
            padding: 20px;
            
            background-color:white;
            color:black;
            text-align: center;
            justify-content:center;
            font-family: Arial, sans-serif;
        }
        .left {
            width: 100%;
            height: 100%;
            padding: 20px;
            
            justify-content: center;
            text-align: center;
    
            color:white;
            background-color:orangered;
            text-align: center;
            justify-content:center;
            font-family: Arial, sans-serif;
        }
        .a{
        color:white;
            text-decoration: none;
            text-align: center;
            background-color:orangered;
            padding-top: 5px;
            padding-bottom: 5px;
            padding-left: 20px;
            padding-right: 20px;
            border: 1px solid white;
            border-radius: 20px;
        }
        .a:hover{
            background-color: blueviolet;
        }
      .b{
        color:black;
        text-decoration: none;
        text-align: center;
      }
      .b:hover{
        color:blueviolet;
      }  
      .c{
        color:white;
        text-decoration: none;
        text-align: center;
        background-color: orangered;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px; ;
        padding-right: 10px;
        border-radius: 20px;
      }
      .c:hover{
        background-color: blueviolet;
      }
      input[type="email"], input[type="password"] {
        width: 80%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius:none;
        background-color: #e7e1e1;
        color: black;
        justify-content: center;
        align-items: center;
      }
      .icons{
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
      }
      .icons i{
        margin: 10px;
        font-size: 20px;
        width: 30px;
        height: 30px;
        display: inline-flex; 
        color: black;
        border-radius: 30px;
        border: 1px solid rgb(189, 179, 179);
        justify-content: center;
        align-items: center;
      }
      .fa-brands.fa-facebook-f{
        color:rgb(3, 3, 51);
      }
       .fa-brands.fa-facebook-f:hover{
        color:blueviolet;
    }
    .fa-brands.fa-google-plus-g{
        color:rgb(255, 0, 0);
      }
       .fa-brands.fa-google-plus-g:hover{
        color:blueviolet;
    }
    .fa-brands.fa-instagram{
        color:blue;
      }
       .fa-brands.fa-instagram:hover{
        color:blueviolet;
    }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
<div class="left">
    <h2>Hello, Friend!</h2>
   <p>Enter your personal details and start<BR> journey with us</p>
   <a class="a" href="">SIGN UP</a>
</div>
<div class="right">
    <h2>Sign in</h2>
    <div class="icons">
    <i class="fa-brands fa-facebook-f"></i>
<i class="fa-brands fa-google-plus-g"></i>
<i class="fa-brands fa-instagram"></i>
</div>
<p>or use your email account</p>
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<br>
<a class="b" href="">Forgot your password?</a>
<br>
<br>
<a class="c" href="">SIGN IN</a>
</div>
</div>  
<br>
<br>
<a href="index.html">home</a>
</body>
</html>
